name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run test suite
        run: |
          pytest -v -rs tests/

  package-reproducibility:
    name: Package Build & Provenance Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build sdist and wheel from clean checkout
        run: |
          python -m build

      - name: Verify package contents and compute SHA-256 checksums
        run: |
          echo "### Release Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | SHA-256 | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for f in dist/*; do
            HASH=$(sha256sum "$f" | cut -d' ' -f1)
            SIZE=$(stat -c%s "$f")
            NAME=$(basename "$f")
            echo "| \`$NAME\` | \`$HASH\` | $SIZE bytes |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Test installation in clean isolated environment
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          credcloak --version
          credcloak audit --help
          credcloak scrub --help
          credcloak harden --help
          credcloak status --help
          credcloak run --help
          pip install ".[proxy]"
          deactivate
