name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run test suite
        run: |
          pytest -v -rs tests/

  package-reproducibility:
    name: Package Build & Provenance Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build sdist and wheel from clean checkout (Build 1)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          python -m build --outdir dist

      - name: Independent rebuild from clean environment (Build 2)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          python -m build --outdir dist_rebuild

      - name: Verify package contents and compute SHA-256 checksums
        run: |
          echo "### Release Artifact Checksums & Reproducibility" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | SHA-256 (Build 1) | Size | Rebuild Match |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          MISMATCH=0
          for f in dist/*; do
            NAME=$(basename "$f")
            if [ ! -f "dist_rebuild/$NAME" ]; then
              echo "::error::Missing artifact in rebuild: dist_rebuild/$NAME"
              exit 1
            fi
            HASH1=$(sha256sum "dist/$NAME" | cut -d' ' -f1)
            HASH2=$(sha256sum "dist_rebuild/$NAME" | cut -d' ' -f1)
            SIZE=$(stat -c%s "dist/$NAME")
            if [ "$HASH1" = "$HASH2" ]; then
              MATCH="PASSED (Deterministic)"
              echo "PASS: $NAME matches byte-for-byte across builds ($HASH1)"
            elif [[ "$NAME" == *.whl ]]; then
              MATCH="FAILED (Wheel Checksum Mismatch)"
              echo "::error::Binary wheel mismatch for $NAME: Build 1 ($HASH1) != Build 2 ($HASH2)"
              MISMATCH=1
            else
              python -c "
import tarfile, hashlib, sys
t1 = tarfile.open('dist/$NAME')
t2 = tarfile.open('dist_rebuild/$NAME')
n1, n2 = sorted(t1.getnames()), sorted(t2.getnames())
if n1 != n2:
    sys.exit(f'Sdist member list mismatch: {n1} != {n2}')
for m in n1:
    f1, f2 = t1.extractfile(m), t2.extractfile(m)
    if f1 and f2:
        h1 = hashlib.sha256(f1.read()).hexdigest()
        h2 = hashlib.sha256(f2.read()).hexdigest()
        if h1 != h2:
            sys.exit(f'Sdist content mismatch in {m}: {h1} != {h2}')
print('Sdist internal file contents verified 100% identical byte-for-byte')
"
              MATCH="PASSED (Content Deterministic; gzip container metadata variance documented)"
              echo "PASS: $NAME internal code and manifests verified 100% identical byte-for-byte"
            fi
            echo "| \`$NAME\` | \`$HASH1\` | $SIZE bytes | $MATCH |" >> $GITHUB_STEP_SUMMARY
          done
          if [ "$MISMATCH" -ne 0 ]; then
            echo "::error::Reproducibility release gate failed: binary wheel was not deterministic"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: credcloak-packages
          path: dist/*
          retention-days: 90

      - name: Test installation in clean isolated environment
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          credcloak --version
          credcloak audit --help
          credcloak scrub --help
          credcloak harden --help
          credcloak status --help
          credcloak run --help
          pip install ".[proxy]"
          deactivate
