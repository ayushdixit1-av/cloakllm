[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloakllm"
version = "0.1.0"
description = "Audit local AI coding transcripts for exposed .env secrets and wrap Claude Code in a reversible, fail-closed credential proxy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayush Dixit", email = "ayushdixitvsecpanki@gmail.com" }
]
keywords = ["security", "llm", "claude-code", "secrets", "privacy", "proxy", "dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Base package is 100% Python standard library for offline audit, scrub, harden, and status
dependencies = []

[project.optional-dependencies]
proxy = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
cloakllm = "cloakllm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloakllm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
